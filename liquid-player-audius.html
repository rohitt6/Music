<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liquid Player</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{color-scheme:dark;--sh:rgba(120,90,255,.6);box-sizing:border-box}
html,body{height:100%;margin:0;background:#07070d;color:#fff;font-family:Inter,-apple-system,"SF Pro Display",system-ui,sans-serif;letter-spacing:-.01em;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;filter:blur(18px) saturate(1.5);transform:scale(1.15);z-index:0}
.shell{position:fixed;inset:0;margin:auto;max-width:1180px;display:grid;grid-template-columns:minmax(340px,430px) 1fr;gap:16px;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));z-index:1}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.04));backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,.06);border-top-color:rgba(255,255,255,.16);border-left-color:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -24px 48px rgba(0,0,0,.14),0 24px 70px rgba(0,0,0,.35);border-radius:32px}
#pl{overflow-y:auto;min-height:0}
.btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.08);border-top-color:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.15);backdrop-filter:blur(12px);cursor:pointer;color:#fff;transition:transform .45s cubic-bezier(.22,1,.36,1),background .3s,opacity .3s}
.btn:hover{background:rgba(255,255,255,.2)}.btn:active{transform:scale(.88)}
.btn svg{width:20px;height:20px}
.ct{background:none;border:0;box-shadow:none;backdrop-filter:none;width:48px;height:48px;opacity:.65}.ct:hover{background:rgba(255,255,255,.1);opacity:1}.ct svg{width:26px;height:26px}
.ct.act{opacity:1;background:rgba(255,255,255,.2)}
.big{width:70px;height:70px;background:#fff;color:#111;opacity:1;box-shadow:0 8px 30px rgba(255,255,255,.25)}.big:hover{background:#fff}.big svg{width:32px;height:32px}
.art{transform:scale(.84);box-shadow:0 14px 30px -12px rgba(0,0,0,.5);transition:transform .8s cubic-bezier(.22,1,.36,1),box-shadow .8s cubic-bezier(.22,1,.36,1)}
body.pl .art{transform:scale(1);box-shadow:0 44px 90px -10px var(--sh),0 18px 40px -10px rgba(0,0,0,.5)}
#vz{position:absolute;left:-25%;top:-25%;width:150%;height:150%;pointer-events:none}
.bar{height:24px;display:flex;align-items:center;cursor:pointer;position:relative;touch-action:none}
.trk{width:100%;height:5px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden;transition:transform .35s cubic-bezier(.22,1,.36,1)}
.bar:hover .trk{transform:scaleY(1.8)}
.fill{height:100%;width:0;background:#fff;border-radius:9px;box-shadow:0 0 12px rgba(255,255,255,.6)}
.tip{position:absolute;bottom:26px;transform:translateX(-50%);padding:3px 9px;border-radius:9px;font-size:12px;font-variant-numeric:tabular-nums;background:rgba(20,20,30,.6);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.15);opacity:0;pointer-events:none;transition:opacity .2s}
.bar:hover .tip{opacity:1}
#ly{position:absolute;inset:0;overflow-y:auto;padding:38vh 2rem;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 80%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 80%,transparent)}
#ly::-webkit-scrollbar{display:none}
#lw{position:relative;overflow:hidden;min-height:0}
.ln{margin:0;padding:.45rem 1rem .45rem 0;font-weight:700;font-size:clamp(1.7rem,3.4vw,2.7rem);line-height:1.18;letter-spacing:-.035em;cursor:pointer;transform-origin:left center;transform:scale(.9);filter:blur(1.5px);opacity:.35;transition:transform .8s cubic-bezier(.34,1.56,.64,1),filter .5s,opacity .5s,text-shadow .5s}
.ln:hover{opacity:.6}
.ln.on{transform:scale(1);filter:none;opacity:1;text-shadow:0 0 30px rgba(255,255,255,.55)}
#q{position:fixed;top:16px;bottom:16px;right:16px;width:min(360px,calc(100vw - 32px));padding:20px;overflow:auto;z-index:20;transform:translateX(115%);transition:transform .6s cubic-bezier(.22,1,.36,1)}
body.qo #q{transform:none}
.qi{display:flex;gap:12px;align-items:center;padding:8px;border-radius:16px;cursor:pointer;transition:background .3s}
.qi:hover{background:rgba(255,255,255,.08)}.qi.on{background:rgba(255,255,255,.16)}
.qi img{width:46px;height:46px;border-radius:9px}.qi div{min-width:0}.qi b,.qi small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qi small{opacity:.55}.qi span{margin-left:auto;opacity:.5;font-size:12px}
#drop{position:fixed;inset:12px;z-index:30;display:none;place-items:center;border:2px dashed rgba(255,255,255,.5);border-radius:36px;font-size:1.3rem;font-weight:600;background:rgba(10,10,20,.5);backdrop-filter:blur(20px)}
body.dg #drop{display:grid}
@media(max-width:767px){.shell{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr)}#lw{display:none}body.lyr #lw{display:block}body.lyr #pl{display:none}#ly{padding:30vh 1.4rem}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main class="shell" id="sh">
  <section id="pl" class="glass p-5 sm:p-7 flex flex-col">
    <header class="flex items-center justify-between">
      <span class="text-xs font-semibold tracking-[.18em] uppercase opacity-60">Liquid Player</span>
      <div class="flex gap-2">
        <label class="btn" title="Add local audio or .lrc"><input id="fi" type="file" multiple accept="audio/*,.flac,.lrc,.txt" hidden><i data-i="plus"></i></label>
        <button class="btn md:hidden" id="bl" data-i="lyr" title="Lyrics"></button>
        <button class="btn" id="bs" data-i="srch" title="Search Audius"></button>
        <button class="btn" id="bq" data-i="q" title="Queue"></button>
      </div>
    </header>
    <div class="flex-1 flex items-center justify-center min-h-0 py-5">
      <div class="relative aspect-square" style="width:min(76vw,330px,40vh)">
        <canvas id="vz" width="600" height="600"></canvas>
        <img id="art" class="art relative w-full h-full object-cover rounded-[22px]" alt="Album art">
      </div>
    </div>
    <div class="mb-2">
      <h1 id="tt" class="text-2xl font-bold tracking-tight truncate"></h1>
      <p id="ar" class="opacity-60 truncate"></p>
      <p id="st" class="text-xs opacity-50 h-4"></p>
    </div>
    <div class="bar" id="pb"><div class="trk"><div class="fill" id="pf"></div></div><span class="tip" id="tp">0:00</span></div>
    <div class="flex justify-between text-xs opacity-60 tabular-nums -mt-1"><span id="tl">0:00</span><span id="tr">-0:00</span></div>
    <div class="flex items-center justify-between my-2">
      <button class="btn ct" id="sf" data-i="shuf" title="Shuffle"></button>
      <button class="btn ct" id="pv" data-i="prev" title="Previous"></button>
      <button class="btn ct big pp" title="Play / Pause (Space)"></button>
      <button class="btn ct" id="nx" data-i="next" title="Next"></button>
      <button class="btn ct" id="rp" title="Repeat"></button>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn" id="mu" title="Mute (M)"></button>
      <div class="bar flex-1" id="vb"><div class="trk"><div class="fill" id="vf"></div></div></div>
    </div>
  </section>
  <section id="lw" class="glass">
    <div class="md:hidden absolute top-3 left-3 right-3 z-10 flex justify-between"><button class="btn" id="bl2" data-i="lyr"></button><button class="btn pp"></button></div>
    <div id="ly"></div>
  </section>
</main>
<aside id="q" class="glass"><input id="sq" type="text" placeholder="Search millions of tracks on Audius…" autocomplete="off" class="w-full rounded-full px-4 py-2 mb-3 outline-none text-sm bg-white/10 border border-white/15 placeholder-white/50"><h2 id="rh" class="text-xs font-semibold uppercase tracking-widest opacity-60 mb-1">Trending on Audius</h2><div id="rs"></div><h2 class="text-xs font-semibold uppercase tracking-widest opacity-60 mb-1 mt-5">Up Next</h2><div id="ql"></div></aside>
<div id="drop">Drop audio (MP3, FLAC, WAV) or an .lrc lyrics file</div>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),B=document.body;
const fmt=s=>{s=Math.max(0,s|0);return(s/60|0)+':'+String(s%60).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),mf=m=>440*2**((m-69)/12);
const S=d=>`<path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="${d}"/>`,F=d=>`<path fill="currentColor" d="${d}"/>`;
const IC={play:F('M8 5v14l11-7z'),pause:F('M6 5h4v14H6zM14 5h4v14h-4z'),prev:F('M6 6h2v12H6zM20 6v12L9.5 12z'),next:F('M16 6h2v12h-2zM4 6v12l10.5-6z'),
shuf:S('M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5'),rep:S('M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3'),
vol:S('M11 5L6 9H2v6h4l5 4zM15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13'),mute:S('M11 5L6 9H2v6h4l5 4zM23 9l-6 6M17 9l6 6'),
q:S('M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01'),lyr:S('M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z'),plus:S('M12 5v14M5 12h14'),srch:S('M11 19a8 8 0 100-16 8 8 0 000 16zM21 21l-4.3-4.3')};
IC.rep1=IC.rep+'<text x="12" y="15" font-size="8" font-weight="700" fill="currentColor" text-anchor="middle">1</text>';
const svg=n=>`<svg viewBox="0 0 24 24">${IC[n]}</svg>`;
const hs=h=>{const f=n=>{const k=(n+h/30)%12;return Math.round(255*(.5-.4*Math.max(-1,Math.min(k-3,9-k,1))))};return[f(0),f(8),f(4)]};

/* ---------- Demo tracks: original, synthesized in-browser (royalty-free) ---------- */
const T=[
{title:'Neon Tides',artist:'Aurora Vale',bpm:96,root:57,bars:16,prog:[[0,'m'],[8,'M'],[3,'M'],[10,'M']],pal:[[255,77,141],[122,92,255],[37,208,255],[255,159,90]],
ly:'City lights are melting into the sea|Every window hums a quiet melody|I’m drifting on the neon tide|With nothing left to hide|Hold me where the colors blend|Let this night never end|Pulse of the city, heartbeat of the sky|We’re weightless, we’re floating by|Oh, carry me, carry me home|Through the glow, through the foam|Neon tide, neon tide|Pull me in, pull me wide|Dawn is spilling over glass|Hold this moment while it lasts|♪'},
{title:'Golden Hour Static',artist:'Kite & Lumen',bpm:112,root:60,bars:20,prog:[[0,'M'],[9,'m'],[5,'M'],[7,'M']],pal:[[255,179,71],[255,94,98],[249,212,35],[196,113,237]],
ly:'Sunlight on the dashboard, radio low|Dust in the air like a slow-motion show|We’ve got nowhere to be|But everywhere to go|Roll the windows down|Let the evening in|Golden hour static|Crackling on the skin|Sing it to the highway|Sing it to the sun|Every mile a memory|Every song a run|Golden hour static|Don’t turn it off|Let the last light linger|Until the stars come up|♪'},
{title:'Midnight Glass',artist:'Sable Echo',bpm:80,root:64,bars:16,prog:[[0,'m'],[3,'M'],[10,'M'],[5,'M']],pal:[[0,198,255],[0,114,255],[127,0,255],[0,242,195]],
ly:'Rain on the glass writes your name|Slowly, slowly, never the same|Streetlights bleed into blue|Every shadow leads to you|Breathe in, the room goes still|Time is bending, bending until|We’re standing in the midnight glass|Watching all the moments pass|Nothing breaks, nothing falls|Only echoes in these walls|Stay a little, stay awhile|Let the dark learn how to smile|Midnight glass|♪'}];

function mk(t){const c=document.createElement('canvas');c.width=c.height=480;const x=c.getContext('2d'),p=t.pal;let s=t.seed;const R=()=>(s=s*16807%2147483647)/2147483647;
 const g=x.createLinearGradient(0,0,480,480);g.addColorStop(0,`rgb(${p[0]})`);g.addColorStop(1,`rgb(${p[2]})`);x.fillStyle=g;x.fillRect(0,0,480,480);
 for(let k=0;k<5;k++){const cx=R()*480,cy=R()*480,r=140+R()*150,q=x.createRadialGradient(cx,cy,0,cx,cy,r);q.addColorStop(0,`rgba(${p[k%4]},.95)`);q.addColorStop(1,`rgba(${p[k%4]},0)`);x.fillStyle=q;x.fillRect(0,0,480,480)}
 t.rgb=[[40,40],[440,40],[40,440],[440,330]].map(([a,b])=>[...x.getImageData(a,b,1,1).data].slice(0,3));
 x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=3;[90,52].forEach(r=>{x.beginPath();x.arc(240,200,r,0,7);x.stroke()});
 x.fillStyle='#fff';x.font='700 34px Inter,system-ui,sans-serif';x.fillText(t.title,28,440,420);t.img=c.toDataURL('image/jpeg',.88)}
T.forEach((t,i)=>{t.seed=7919*(i+1);mk(t);const bar=240/t.bpm;t.dur=bar*t.bars+1.5;t.L=t.ly.split('|').map((l,k)=>[(k+1)*bar,l])});

async function synth(t){
 const sr=22050,sp=60/t.bpm,bar=sp*4,dur=t.dur,oc=new OfflineAudioContext(2,dur*sr|0,sr);
 const m=oc.createGain();m.gain.setValueAtTime(.55,0);m.gain.setValueAtTime(.55,dur-3);m.gain.linearRampToValueAtTime(0,dur-.1);m.connect(oc.destination);
 const nb=oc.createBuffer(1,sr,sr),nd=nb.getChannelData(0);for(let i=0;i<sr;i++)nd[i]=Math.random()*2-1;
 const dl=oc.createDelay(1),fb=oc.createGain();dl.delayTime.value=sp*.75;fb.gain.value=.38;dl.connect(fb);fb.connect(dl);dl.connect(m);
 const tone=(f,s,l,ty,v,lp,a,h,send,pan)=>{const o=oc.createOscillator(),g=oc.createGain(),F=oc.createBiquadFilter(),p=oc.createStereoPanner();o.type=ty;o.frequency.value=f;F.frequency.value=lp;
  g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+a);g.gain.setValueAtTime(v,s+a+l*h);g.gain.exponentialRampToValueAtTime(1e-4,s+l);p.pan.value=pan||0;
  o.connect(F);F.connect(g);g.connect(p);p.connect(m);if(send)p.connect(dl);o.start(s);o.stop(s+l+.05)};
 const nz=(s,l,v,ty,fr)=>{const o=oc.createBufferSource(),g=oc.createGain(),F=oc.createBiquadFilter();o.buffer=nb;F.type=ty;F.frequency.value=fr;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(1e-4,s+l);o.connect(F);F.connect(g);g.connect(m);o.start(s);o.stop(s+l)};
 for(let b=0;b<t.bars;b++){
  const[r,q]=t.prog[b%4],c=[0,q=='m'?3:4,7].map(x=>t.root+r+x),s0=b*bar;
  c.forEach((n,k)=>tone(mf(n),s0,bar*1.1,'sawtooth',.04,1000,.3,.6,0,[-.5,0,.5][k]));
  if(b>0&&b<t.bars-1)for(let e=0;e<8;e++)tone(mf(c[[0,1,2,1,2,1,0,1][e]]+12),s0+e*sp/2,.35,'triangle',.08,3200,.005,0,1,e%2?.35:-.35);
  [0,1.5,2.5].forEach(x=>tone(mf(t.root+r-12),s0+x*sp,sp*.9,'triangle',.4,500,.01,.3));
  if(b>1&&b<t.bars-1)for(let x=0;x<4;x++){const s=s0+x*sp;
   if(x%2==0){const o=oc.createOscillator(),g=oc.createGain();o.frequency.setValueAtTime(130,s);o.frequency.exponentialRampToValueAtTime(42,s+.14);g.gain.setValueAtTime(.9,s);g.gain.exponentialRampToValueAtTime(1e-4,s+.35);o.connect(g);g.connect(m);o.start(s);o.stop(s+.4)}
   else nz(s,.16,.3,'bandpass',1800);
   nz(s,.03,.08,'highpass',7500);nz(s+sp/2,.04,.16,'highpass',7500)}}
 return oc.startRendering()}

/* ---------- Playback engine (Web Audio) ---------- */
let ctx,gn,an,src,buf,off=0,t0=0,playing=0,vol=.8,muted=0,shuf=0,rep=0,req=0,cur=0,drag=-1,lastL=-1,scrollT=0,bass=0;
const fd=new Uint8Array(128),durOf=t=>t.buf?t.buf.duration:t.dur;
function ens(){if(ctx)return;ctx=new AudioContext();gn=ctx.createGain();an=ctx.createAnalyser();an.fftSize=256;an.smoothingTimeConstant=.8;gn.connect(an);an.connect(ctx.destination);gn.gain.value=muted?0:vol}
const pos=()=>playing?Math.min(off+ctx.currentTime-t0,buf.duration):off;
function kill(){if(src){src.onended=null;try{src.stop()}catch(e){}src=null}}
function start(o){kill();const s=ctx.createBufferSource();s.buffer=buf;s.connect(gn);s.onended=()=>{if(src===s){playing=0;off=0;ui();ended()}};s.start(0,o);src=s;off=o;t0=ctx.currentTime;playing=1;ui()}
async function play(){ens();const my=++req,t=T[cur];await ctx.resume();
 if(!t.buf){const st=$('#st');try{if(t.url){st.textContent='Loading stream…';t.buf=await ctx.decodeAudioData(await(await fetch(t.url)).arrayBuffer())}else{st.textContent='Rendering audio…';t.buf=await synth(t)}st.textContent='';rq()}catch(e){st.textContent='Couldn’t load this track (network or CORS)';return}}
 if(my!==req)return;buf=t.buf;start(off)}
function pause(){if(!playing)return;off=pos();kill();playing=0;ui()}
const tg=()=>playing?pause():play();
async function go(i,pl){cur=i;++req;kill();playing=0;off=0;setUI();if(pl)await play()}
function nxt(d,auto){let i;if(shuf&&T.length>1){do i=Math.random()*T.length|0;while(i==cur)}else{i=cur+d;if(i>=T.length||i<0){if(auto&&!rep){go(0,0);return}i=(i+T.length)%T.length}}go(i,1)}
function ended(){rep==2?(off=0,play()):nxt(1,1)}
function seek(t){const d=durOf(T[cur]);t=Math.max(0,Math.min(t,d-.05));lastL=-1;playing?start(t):off=t}
function setVol(v){vol=Math.max(0,Math.min(1,v));muted=0;if(gn)gn.gain.value=vol;ui()}
function mute(){muted=!muted;if(gn)gn.gain.value=muted?0:vol;ui()}

/* ---------- UI ---------- */
function ui(){B.classList.toggle('pl',!!playing);$$('.pp').forEach(b=>b.innerHTML=svg(playing?'pause':'play'));
 $('#sf').classList.toggle('act',!!shuf);$('#rp').classList.toggle('act',rep>0);$('#rp').innerHTML=svg(rep==2?'rep1':'rep');
 $('#mu').innerHTML=svg(muted||!vol?'mute':'vol');$('#vf').style.width=(muted?0:vol*100)+'%'}
function buildL(){const L=T[cur].L,ly=$('#ly');lastL=-1;
 ly.innerHTML=L&&L.length?L.map((l,i)=>`<p class="ln" data-i="${i}">${esc(l[1])||'♪'}</p>`).join(''):'<p class="ln on" style="font-size:1.3rem;cursor:default">No synced lyrics for this track.<br>Drop a .lrc file here to add them.</p>';ly.scrollTop=0}
function actL(p){const L=T[cur].L;if(!L)return;let k=-1;for(let i=0;i<L.length;i++){if(L[i][0]<=p+.1)k=i;else break}
 if(k==lastL)return;lastL=k;const ly=$('#ly');[...ly.children].forEach((e,i)=>e.classList.toggle('on',i==k));
 if(k>=0&&Date.now()-scrollT>2500){const e=ly.children[k];ly.scrollTo({top:e.offsetTop-ly.clientHeight*.4+e.offsetHeight/2,behavior:'smooth'})}}
function rq(){$('#ql').innerHTML=T.map((t,i)=>`<div class="qi ${i==cur?'on':''}" data-i="${i}"><img src="${t.img}" alt=""><div><b>${esc(t.title)}</b><small>${esc(t.artist)}</small></div><span>${fmt(durOf(t))}</span></div>`).join('')}
function setUI(){const t=T[cur];$('#tt').textContent=t.title;$('#ar').textContent=t.artist;$('#art').src=t.img;$('#st').textContent=t.buf||t.dur?'':'';document.title=t.title+' · Liquid Player';
 B.style.setProperty('--sh',`rgba(${t.rgb[0]},.65)`);buildL();rq();ui()}
function bar(el,fn,tip){const fr=e=>{const r=el.getBoundingClientRect();return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))};let d=0;
 el.onpointerdown=e=>{d=1;el.setPointerCapture(e.pointerId);fn(fr(e),0)};
 el.onpointermove=e=>{if(tip)tip(fr(e),e);if(d)fn(fr(e),0)};
 el.onpointerup=e=>{if(d){d=0;fn(fr(e),1)}}}
bar($('#pb'),(f,c)=>{if(c){drag=-1;seek(f*durOf(T[cur]))}else drag=f},(f,e)=>{const tp=$('#tp');tp.style.left=(e.clientX-$('#pb').getBoundingClientRect().left)+'px';tp.textContent=fmt(f*durOf(T[cur]))});
bar($('#vb'),f=>setVol(f));

/* ---------- Visuals ---------- */
const bg=$('#bg'),bx=bg.getContext('2d'),vz=$('#vz'),vx=vz.getContext('2d');bg.width=192;bg.height=108;
const cc=[[40,30,80],[70,40,110],[30,70,110],[100,40,70]];
function drawBg(tm){const tg=T[cur].rgb;cc.forEach((c,i)=>{for(let k=0;k<3;k++)c[k]+=(tg[i][k]-c[k])*.03});
 bx.fillStyle='#07070d';bx.fillRect(0,0,192,108);
 for(let i=0;i<6;i++){const c=cc[i%4].map(Math.round),x=96+Math.sin(tm*.00011*(i+1)+i*2)*90,y=54+Math.cos(tm*.00013*(i+2)+i)*50,r=(58+i*6)*(1+bass*.4),g=bx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(${c},.85)`);g.addColorStop(1,`rgba(${c},0)`);bx.fillStyle=g;bx.fillRect(0,0,192,108)}}
function drawVz(tm){const t=T[cur],c=t.rgb[0],c2=t.rgb[1];vx.clearRect(0,0,600,600);
 const g=vx.createRadialGradient(300,300,170,300,300,300);g.addColorStop(0,`rgba(${c},${.12+bass*.7})`);g.addColorStop(1,`rgba(${c},0)`);vx.fillStyle=g;vx.fillRect(0,0,600,600);
 const N=72,P=[];for(let i=0;i<N;i++){const j=Math.min(i,N-i),v=fd[1+(j*1.7|0)]/255,a=i/N*6.2832-1.5708,r=212+v*62+Math.sin(tm*.002+i*.5)*2;P.push([300+Math.cos(a)*r,300+Math.sin(a)*r])}
 vx.beginPath();vx.moveTo((P[N-1][0]+P[0][0])/2,(P[N-1][1]+P[0][1])/2);
 for(let i=0;i<N;i++){const n=P[(i+1)%N];vx.quadraticCurveTo(P[i][0],P[i][1],(P[i][0]+n[0])/2,(P[i][1]+n[1])/2)}
 vx.closePath();vx.fillStyle=`rgba(${c2},.18)`;vx.fill();vx.strokeStyle='rgba(255,255,255,.6)';vx.lineWidth=3;vx.stroke()}
function frame(tm){requestAnimationFrame(frame);
 if(an)an.getByteFrequencyData(fd);let b=0;for(let i=0;i<6;i++)b+=fd[i];bass+=(b/6/255-bass)*.3;
 drawBg(tm);drawVz(tm);
 const d=durOf(T[cur]),p=drag>=0?drag*d:pos();$('#pf').style.width=(p/d*100)+'%';$('#tl').textContent=fmt(p);$('#tr').textContent='-'+fmt(d-p);actL(p)}

/* ---------- Files, events ---------- */
async function files(fl){let n=0;for(const f of fl){
 if(/\.(lrc|txt)$/i.test(f.name)){const L=[...(await f.text()).matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]([^\n\r]*)/g)].map(m=>[+m[1]*60+ +m[2],m[3].trim()]);if(L.length){T[cur].L=L;buildL()}continue}
 try{ens();const b=await ctx.decodeAudioData(await f.arrayBuffer()),h=Math.abs([...f.name].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7)),H=h%360;
  const t={title:f.name.replace(/\.[^.]+$/,''),artist:'Local file',pal:[0,50,150,200].map(d=>hs(H+d)),seed:h+1,buf:b,L:null};mk(t);T.push(t);n++}
 catch(e){$('#st').textContent='Couldn’t decode '+f.name}}
 rq();if(n)go(T.length-1,1)}
$('#fi').onchange=e=>{files(e.target.files);e.target.value=''};
let dc=0;addEventListener('dragenter',e=>{e.preventDefault();dc++;B.classList.add('dg')});addEventListener('dragleave',()=>{if(--dc<=0){dc=0;B.classList.remove('dg')}});
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();dc=0;B.classList.remove('dg');files(e.dataTransfer.files)});
$$('.pp').forEach(b=>b.onclick=tg);
$('#nx').onclick=()=>nxt(1);$('#pv').onclick=()=>pos()>3?seek(0):nxt(-1);
$('#sf').onclick=()=>{shuf=!shuf;ui()};$('#rp').onclick=()=>{rep=(rep+1)%3;ui()};$('#mu').onclick=mute;
$('#bl').onclick=$('#bl2').onclick=()=>B.classList.toggle('lyr');
$('#bq').onclick=e=>{e.stopPropagation();B.classList.toggle('qo')};$('#sh').onclick=()=>B.classList.remove('qo');
$('#ql').onclick=e=>{const q=e.target.closest('.qi');if(q)go(+q.dataset.i,1)};
$('#ly').onclick=e=>{const l=e.target.closest('.ln');if(!l||l.dataset.i==null)return;scrollT=0;seek(T[cur].L[+l.dataset.i][0]);if(!playing)play()};
['wheel','touchmove'].forEach(v=>$('#ly').addEventListener(v,()=>scrollT=Date.now(),{passive:true}));
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b)b.blur()});
addEventListener('keydown',e=>{if(e.target.matches('input[type=text]'))return;const k=e.key;
 if(k==' '){e.preventDefault();tg()}else if(k=='m'||k=='M')mute();
 else if(k=='ArrowRight'){e.preventDefault();seek(pos()+5)}else if(k=='ArrowLeft'){e.preventDefault();seek(pos()-5)}
 else if(k=='ArrowUp'){e.preventDefault();setVol(vol+.05)}else if(k=='ArrowDown'){e.preventDefault();setVol(vol-.05)}});
$$('[data-i]').forEach(e=>{if(IC[e.dataset.i])e.innerHTML=svg(e.dataset.i)});
/* ---------- Audius catalog search + LRCLIB synced lyrics (needs a network-enabled host) ---------- */
const API='https://api.audius.co/v1',APP='app_name=LiquidPlayer';let R=[],sd;
const lrc=s=>[...s.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]([^\n\r]*)/g)].map(m=>[+m[1]*60+ +m[2],m[3].trim()]);
async function search(q){const rs=$('#rs');$('#rh').textContent=q?'Results':'Trending on Audius';rs.innerHTML='<p class="text-sm opacity-60 p-2">Loading…</p>';
 try{const u=q?`${API}/tracks/search?query=${encodeURIComponent(q)}&${APP}&limit=20`:`${API}/tracks/trending?${APP}&limit=20`;
  R=((await(await fetch(u)).json()).data)||[];
  rs.innerHTML=R.length?R.map((r,i)=>`<div class="qi" data-r="${i}"><img src="${r.artwork?r.artwork['150x150']:''}" alt="" onerror="this.style.visibility='hidden'"><div><b>${esc(r.title)}</b><small>${esc(r.user.name)}</small></div><span>${fmt(r.duration)}</span></div>`).join(''):'<p class="text-sm opacity-60 p-2">No results.</p>'}
 catch(e){rs.innerHTML='<p class="text-sm opacity-60 p-2">Couldn’t reach Audius. Open this file locally or host it; sandboxed previews block outside requests.</p>'}}
function art(t,r){const u=r.artwork&&(r.artwork['480x480']||r.artwork['150x150']);if(!u)return;const im=new Image();im.crossOrigin='anonymous';
 const show=()=>{t.img=u;if(T[cur]===t){$('#art').src=u;B.style.setProperty('--sh',`rgba(${t.rgb[0]},.65)`)}rq()};
 im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=2;const x=c.getContext('2d');x.drawImage(im,0,0,2,2);const d=x.getImageData(0,0,2,2).data;t.rgb=[0,1,2,3].map(i=>[...d.slice(i*4,i*4+3)])}catch(e){}show()};
 im.onerror=show;im.src=u}
async function lyr(t){try{const j=await(await fetch('https://lrclib.net/api/search?q='+encodeURIComponent(t.title+' '+t.artist))).json(),h=j.find(x=>x.syncedLyrics);if(h){t.L=lrc(h.syncedLyrics);if(T[cur]===t)buildL()}}catch(e){}}
function addR(r){const id='a'+r.id;let i=T.findIndex(t=>t.id==id);
 if(i<0){const h=Math.abs([...r.id].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7)),H=h%360,t={id,title:r.title,artist:r.user.name,pal:[0,50,150,200].map(d=>hs(H+d)),seed:h+1,dur:r.duration,url:`${API}/tracks/${r.id}/stream?${APP}`,L:null};
  mk(t);T.push(t);i=T.length-1;art(t,r);lyr(t)}
 go(i,1)}
$('#rs').onclick=e=>{const q=e.target.closest('.qi');if(q)addR(R[+q.dataset.r])};
$('#sq').oninput=e=>{clearTimeout(sd);sd=setTimeout(()=>search(e.target.value.trim()),400)};
$('#bs').onclick=e=>{e.stopPropagation();B.classList.add('qo');$('#sq').focus()};
search('');
setUI();requestAnimationFrame(frame);
